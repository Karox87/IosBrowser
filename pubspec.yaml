name: iosbrowser
description: "A professional Flutter browser."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  
  # Standard Icons
  cupertino_icons: ^1.0.8
  
  # Browser core dependencies
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.4
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Ensure you have the file "assets/fonts/NotoNaskhArabic-Regular.ttf"
  # inside your project folder. If you do not have this file, 
  # remove the 'fonts' section below to prevent the app from crashing.
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf